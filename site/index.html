<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fx‑991ES PLUS — حاسبة علمية</title>
<meta name="description" content="حاسبة علمية مجانية على الويب بواجهة مستوحاة من Casio fx-991ES PLUS.">
<style>
:root{--ink:#e9eee8;--muted:#9da89e;--body:#151a16;--case:#293029;--case2:#202720;--edge:#485247;--lcd:#c9e5c6;--lcdink:#243126;--orange:#f2a33c;--blue:#9bb9d7;--key:#3c463d;--key2:#303930;--white:#d7ddd7;--danger:#e88978;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#3b473c 0,#151a16 48%);min-height:100vh;color:var(--ink);padding:24px 14px 42px}button{font:inherit;color:inherit;border:0;cursor:pointer}.shell{max-width:570px;margin:auto;background:linear-gradient(145deg,#303830,#202720);border:1px solid #566155;border-radius:24px;padding:20px;box-shadow:0 26px 70px #0009, inset 0 1px #ffffff1c}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.brand{font-weight:800;letter-spacing:.3px}.brand small{display:block;color:var(--orange);font-size:10px;letter-spacing:2px}.model{font-family:monospace;color:#bbc5ba;font-size:12px}.display{background:var(--lcd);color:var(--lcdink);border-radius:9px;min-height:128px;padding:12px 15px;box-shadow:inset 0 3px 10px #24312666,inset 0 -1px #fff8;position:relative;overflow:hidden}.indicators{height:19px;font:11px monospace;display:flex;gap:14px;color:#54705a}.indicators span{opacity:.25}.indicators span.on{opacity:1}.history{font:12px monospace;color:#608068;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}.expression{font:clamp(22px,6vw,34px) monospace;direction:ltr;text-align:right;white-space:nowrap;overflow-x:auto;min-height:48px;padding-top:4px}.answer{font:16px monospace;direction:ltr;text-align:right;color:#48634d;min-height:23px}.status{position:absolute;bottom:7px;left:13px;font:10px monospace;color:#58745d}.toolbar{display:flex;gap:8px;margin:14px 0 10px}.tool{flex:1;border:1px solid var(--edge);background:#222a22;border-radius:8px;padding:7px 4px;font-size:11px;color:var(--muted)}.tool.active{color:var(--orange);border-color:#98703b;background:#403320}.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;direction:ltr}.key{min-height:52px;border-radius:9px;background:linear-gradient(#475247,#303930);box-shadow:0 3px 0 #161b16,inset 0 1px #ffffff1b;font-weight:750;position:relative;transition:.08s transform,.08s box-shadow}.key:active{transform:translateY(3px);box-shadow:0 0 #161b16,inset 0 1px #ffffff1b}.key .sub{position:absolute;top:3px;left:6px;font-size:10px;color:var(--orange);font-weight:600}.key.fn{background:linear-gradient(#d6dcd5,#aeb7ad);color:#1e281f}.key.op{background:linear-gradient(#536354,#3d493f);color:#eef2ee}.key.eq{background:var(--orange);color:#261b0d;box-shadow:0 3px 0 #a86c1d}.key.danger{color:var(--danger)}.key.wide{grid-column:span 2}.footer{color:var(--muted);font-size:12px;text-align:center;max-width:570px;margin:18px auto 0;line-height:1.7}.footer a{color:var(--orange);text-decoration:none}.help{margin-top:14px;color:#aeb8ae;font-size:11px;text-align:center;direction:rtl}@media(max-width:400px){body{padding:10px 7px}.shell{padding:14px;border-radius:18px}.keypad{gap:7px}.key{min-height:48px;font-size:14px}.expression{font-size:24px}}
</style>
</head>
<body>
<main class="shell" aria-label="حاسبة علمية fx-991ES PLUS">
  <header class="top"><div class="brand"><small>SCIENTIFIC CALCULATOR</small>حاسبة علمية</div><div class="model">fx‑991ES PLUS</div></header>
  <section class="display" aria-live="polite"><div class="indicators"><span id="shiftLed">SHIFT</span><span id="alphaLed">ALPHA</span><span id="modeLed" class="on">MATH</span><span id="angleLed">DEG</span></div><div class="history" id="history"></div><div class="expression" id="expression">0</div><div class="answer" id="answer"></div><div class="status" id="status">Ready</div></section>
  <div class="toolbar"><button class="tool" id="shiftBtn">SHIFT</button><button class="tool" id="angleBtn">DEG</button><button class="tool" id="memoryBtn">M</button><button class="tool" id="clearBtn">AC</button></div>
  <section class="keypad" id="keypad">
    <button class="key fn" data-action="shift"><span class="sub">SHIFT</span>SHIFT</button><button class="key fn" data-action="alpha"><span class="sub">ALPHA</span>ALPHA</button><button class="key fn" data-action="mode"><span class="sub">MODE</span>MODE</button><button class="key fn" data-action="del">DEL</button><button class="key danger" data-action="clear">AC</button>
    <button class="key fn" data-value="sin("><span class="sub">sin⁻¹</span>sin</button><button class="key fn" data-value="cos("><span class="sub">cos⁻¹</span>cos</button><button class="key fn" data-value="tan("><span class="sub">tan⁻¹</span>tan</button><button class="key fn" data-value="log("><span class="sub">10ˣ</span>log</button><button class="key fn" data-value="ln("><span class="sub">eˣ</span>ln</button>
    <button class="key fn" data-value="√("><span class="sub">x²</span>√</button><button class="key fn" data-value="^2">x²</button><button class="key fn" data-value="^">xʸ</button><button class="key fn" data-value="(" >(</button><button class="key fn" data-value=")">)</button>
    <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key op" data-value="÷">÷</button><button class="key fn" data-value="π">π</button>
    <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key op" data-value="×">×</button><button class="key fn" data-value="e">e</button>
    <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key op" data-value="−">−</button><button class="key fn" data-action="ans">Ans</button>
    <button class="key" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key" data-value="%">%</button><button class="key op" data-value="+">+</button><button class="key eq" data-action="equals">=</button>
  </section>
  <div class="help">يمكنك استخدام لوحة المفاتيح أيضاً · الحسابات تُنفّذ محلياً في متصفحك</div>
</main>
<p class="footer">واجهة تعليمية مستوحاة من <strong>Casio fx‑991ES PLUS</strong> وليست منتجاً رسمياً من Casio · <a href="https://github.com/mohammedalhinaki-cloud/Study-tools" target="_blank" rel="noopener">المصدر على GitHub</a></p>
<script>
const $=s=>document.querySelector(s), exprEl=$('#expression'), ansEl=$('#answer'), histEl=$('#history'), statusEl=$('#status');
let expr='', last='', shift=false, alpha=false, angle='DEG', memory=0;
const setText=()=>{exprEl.textContent=expr||'0';$('#shiftLed').classList.toggle('on',shift);$('#alphaLed').classList.toggle('on',alpha);$('#angleLed').textContent=angle;$('#angleBtn').textContent=angle;};
function append(v){if(v==='−')v='-';if(v==='×')v='*';if(v==='÷')v='/';if(v==='π')v='PI';expr+=v;ansEl.textContent='';setText()}
function factorial(n){if(n<0||n>170||n%1)return NaN;let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function calculate(input){let s=input.replace(/Ans/g,String(last||0)).replace(/√/g,'sqrt').replace(/%/g,'/100').replace(/PI/g,'Math.PI').replace(/\be\b/g,'Math.E').replace(/\^/g,'**');
  s=s.replace(/(\d+(?:\.\d+)?)!/g,'fact($1)');
  const trig=(name,fn)=>{let re=new RegExp(name+'\\(([^()]*)\\)','g');s=s.replace(re,(_,x)=>fn+'('+((angle==='DEG')?'('+x+')*Math.PI/180':x)+')')};
  trig('sin','Math.sin');trig('cos','Math.cos');trig('tan','Math.tan');
  s=s.replace(/asin\(([^()]*)\)/g,'Math.asin($1)').replace(/acos\(([^()]*)\)/g,'Math.acos($1)').replace(/atan\(([^()]*)\)/g,'Math.atan($1)').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/sqrt\(/g,'Math.sqrt(');
  if(!/^[0-9+\-*/().,\sA-Za-z_]*$/.test(s)||s.includes('Math.')){} // transformed math identifiers are explicitly whitelisted below
  if(!/^[0-9+\-*/().,\sA-Za-z_]*$/.test(s))throw Error('Invalid');
  const val=Function('fact','return ('+s+')')(factorial);if(!Number.isFinite(val))throw Error('Math error');return val;
}
function equals(){if(!expr)return;try{const value=calculate(expr);histEl.textContent=expr+' =';ansEl.textContent=nice(value);last=value;expr='';statusEl.textContent='OK';setText()}catch(e){ansEl.textContent='Math ERROR';statusEl.textContent='Check expression'}}
function nice(n){if(Math.abs(n)<1e-12)n=0;return Number.isInteger(n)?String(n):Number(n.toPrecision(12)).toString()}
function clear(){expr='';ansEl.textContent='';histEl.textContent='';statusEl.textContent='Ready';setText()}
function del(){expr=expr.slice(0,-1);setText()}
function action(a){if(a==='shift'){shift=!shift;setText();return}if(a==='alpha'){alpha=!alpha;setText();return}if(a==='mode'){statusEl.textContent='COMP · MATH';return}if(a==='clear'){clear();return}if(a==='del'){del();return}if(a==='equals'){equals();return}if(a==='ans')append('Ans')}
$('#keypad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action)action(b.dataset.action);else if(b.dataset.value){let v=b.dataset.value;if(shift){if(v==='sin(')v='asin(';if(v==='cos(')v='acos(';if(v==='tan(')v='atan(';if(v==='log(')v='10**(';if(v==='ln(')v='Math.E**(';shift=false}append(v);setText()}});
$('#clearBtn').onclick=clear;$('#shiftBtn').onclick=()=>action('shift');$('#angleBtn').onclick=()=>{angle=angle==='DEG'?'RAD':'DEG';setText()};$('#memoryBtn').onclick=()=>{if(ansEl.textContent){memory=Number(last);statusEl.textContent='M stored'}else{append(String(memory));statusEl.textContent='M recalled'}};
document.addEventListener('keydown',e=>{if(e.key==='Enter')return equals();if(e.key==='Escape')return clear();if(e.key==='Backspace')return del();const map={'*':'×','/':'÷','-':'−'};if(/[0-9+\-*/().%]/.test(e.key))append(map[e.key]||e.key)});setText();
</script>
</body></html>
