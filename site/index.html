<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CalcES 991 — حاسبة علمية Natural Textbook</title>
<meta name="description" content="حاسبة علمية بواجهة ES PLUS وشاشة Natural Textbook وأنماط COMP وCMPLX وSTAT وEQN وTABLE.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjs@14.0.1/lib/browser/math.js"></script>
<style>
:root{--bg:#111612;--body:#252d25;--body2:#1d241e;--line:#465246;--lcd:#c7e3c5;--lcd2:#b4d1b5;--lcdink:#233226;--key:#3b463b;--keyhi:#536052;--soft:#aeb9ad;--orange:#f1a33b;--blue:#aec8dd;--red:#e88171;--white:#eff3ed;--mono:"SFMono-Regular",Consolas,monospace;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#435044,#111612 56%);color:var(--white);padding:18px 10px 38px}button{font:inherit;color:inherit;cursor:pointer;border:0}.wrap{width:min(100%,620px);margin:auto}.shell{background:linear-gradient(150deg,#323c32,#202820);border:1px solid #596557;border-radius:25px;padding:20px;box-shadow:0 30px 80px #000b,inset 0 1px #fff2}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:11px}.brand{font-weight:850;font-size:16px;letter-spacing:.2px}.brand small{display:block;color:var(--orange);font:10px var(--mono);letter-spacing:2px;margin-bottom:2px}.model{font:12px var(--mono);color:#c3ccc1}.lcd{background:linear-gradient(145deg,var(--lcd),var(--lcd2));color:var(--lcdink);border-radius:8px;min-height:164px;padding:9px 13px;position:relative;box-shadow:inset 0 3px 13px #20312566,inset 0 -1px #fff9;overflow:hidden}.lcdtop{display:flex;gap:13px;height:21px;align-items:center;font:10px var(--mono);color:#4e6953}.led{opacity:.25}.led.on{opacity:1}.screenmode{margin-inline-start:auto}.historyline{font:12px var(--mono);height:20px;color:#5d7c62;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden}.formula{height:61px;display:flex;align-items:center;justify-content:flex-start;direction:ltr;text-align:left;overflow-x:auto;font-size:25px;white-space:nowrap}.formula .katex{font-size:1.08em}.answer{height:38px;font:18px var(--mono);direction:ltr;text-align:right;white-space:nowrap;overflow-x:auto;color:#425e47}.answer .katex{font-size:1.22em}.hint{position:absolute;bottom:6px;left:12px;font:9px var(--mono);color:#58735c}.toolbar{display:flex;gap:7px;margin:11px 0 8px}.tool{flex:1;background:#202920;border:1px solid var(--line);padding:8px 4px;border-radius:7px;color:var(--soft);font-size:11px}.tool.on,.tool:hover{color:var(--orange);border-color:#a3753e}.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;direction:ltr}.key{position:relative;min-height:49px;border-radius:8px;background:linear-gradient(#4a5649,#303a31);box-shadow:0 3px #151a15,inset 0 1px #fff2;font-weight:750;font-size:15px;transition:transform .06s,box-shadow .06s}.key:active{transform:translateY(3px);box-shadow:0 0 #151a15,inset 0 1px #fff2}.key.fn{background:linear-gradient(#d8ded7,#aeb8af);color:#1c281e}.key.op{color:#f0f4ee;background:linear-gradient(#586557,#3d493f)}.key.eq{background:var(--orange);color:#241a0e;box-shadow:0 3px #a66a1c}.key.danger{color:var(--red)}.key .shift{position:absolute;top:3px;left:6px;color:var(--orange);font:9px var(--mono)}.key .alpha{position:absolute;top:3px;right:6px;color:#86a4c1;font:9px var(--mono)}.key.wide{grid-column:span 2}.foot{text-align:center;color:#98a398;font-size:11px;line-height:1.8;margin:16px auto 0}.foot a{color:var(--orange);text-decoration:none}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:5}.modal[hidden]{display:none}.panel{width:min(100%,480px);background:#293329;border:1px solid #687466;border-radius:15px;padding:17px;box-shadow:0 20px 70px #000}.panel h2{font-size:17px;margin:0 0 5px}.panel p{font-size:12px;color:var(--soft);margin:0 0 14px}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mode{padding:13px;text-align:right;border-radius:8px;background:#202820;border:1px solid var(--line)}.mode b{display:block;color:var(--orange);font:13px var(--mono);margin-bottom:4px}.mode small{color:var(--soft)}.mode.active{border-color:var(--orange);background:#423522}.close{margin-top:14px;padding:9px 17px;border-radius:7px;background:var(--orange);color:#251b0d;font-weight:800}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d261e;border:1px solid var(--orange);border-radius:20px;padding:8px 15px;font-size:12px;z-index:10;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:430px){body{padding:8px 5px}.shell{padding:14px;border-radius:19px}.keys{gap:6px}.key{min-height:45px;font-size:13px}.formula{font-size:21px}.lcd{min-height:153px}.panel{padding:13px}}
</style>
</head>
<body>
<div class="wrap"><main class="shell" aria-label="CalcES 991 scientific calculator">
<header class="head"><div class="brand"><small>NATURAL TEXTBOOK DISPLAY</small>حاسبة علمية</div><div class="model">fx‑991ES PLUS style</div></header>
<section class="lcd" aria-live="polite"><div class="lcdtop"><span id="shiftLed" class="led">SHIFT</span><span id="alphaLed" class="led">ALPHA</span><span id="memLed" class="led">M</span><span id="angleLed">DEG</span><span id="modeLed" class="screenmode">COMP</span></div><div id="historyLine" class="historyline"></div><div id="formula" class="formula">0</div><div id="answer" class="answer"></div><div id="hint" class="hint">MathO · Norm 1</div></section>
<nav class="toolbar"><button id="modeButton" class="tool">MODE</button><button id="setupButton" class="tool">SETUP</button><button id="angleButton" class="tool">DEG</button><button id="formatButton" class="tool">S↔D</button><button id="clearButton" class="tool">AC</button></nav>
<section id="keys" class="keys">
<button class="key fn" data-action="shift"><span class="shift">SHIFT</span>SHIFT</button><button class="key fn" data-action="alpha"><span class="alpha">A</span>ALPHA</button><button class="key fn" data-action="mode">MODE</button><button class="key fn" data-action="setup">SETUP</button><button class="key fn" data-action="back">◀</button><button class="key fn" data-action="forward">▶</button>
<button class="key fn" data-insert="sin("><span class="shift">sin⁻¹</span><span class="alpha">A</span>sin</button><button class="key fn" data-insert="cos("><span class="shift">cos⁻¹</span>cos</button><button class="key fn" data-insert="tan("><span class="shift">tan⁻¹</span>tan</button><button class="key fn" data-insert="log("><span class="shift">10ˣ</span>log</button><button class="key fn" data-insert="ln("><span class="shift">eˣ</span>ln</button><button class="key fn" data-action="delete">DEL</button>
<button class="key fn" data-insert="√("><span class="shift">∛(</span>√</button><button class="key fn" data-insert="^2">x²</button><button class="key fn" data-insert="^">xʸ</button><button class="key fn" data-insert="!">x!</button><button class="key fn" data-insert="1/">1/x</button><button class="key danger" data-action="clear">AC</button>
<button class="key" data-insert="7">7</button><button class="key" data-insert="8">8</button><button class="key" data-insert="9">9</button><button class="key op" data-insert="÷">÷</button><button class="key fn" data-insert="(">(</button><button class="key fn" data-insert=")">)</button>
<button class="key" data-insert="4">4</button><button class="key" data-insert="5">5</button><button class="key" data-insert="6">6</button><button class="key op" data-insert="×">×</button><button class="key fn" data-insert="π">π</button><button class="key fn" data-insert="e">e</button>
<button class="key" data-insert="1">1</button><button class="key" data-insert="2">2</button><button class="key" data-insert="3">3</button><button class="key op" data-insert="−">−</button><button class="key fn" data-action="ans">Ans</button><button class="key fn" data-action="memory">M+</button>
<button class="key wide" data-insert="0">0</button><button class="key" data-insert=".">.</button><button class="key" data-insert=",">,</button><button class="key op" data-insert="+">+</button><button class="key eq" data-action="equals">=</button>
</section></main><p class="foot">واجهة ES PLUS مستقلة للتعلم — ليست منتجاً رسمياً من Casio.<br><a href="https://github.com/mohammedalhinaki-cloud/Study-tools" target="_blank" rel="noopener">المصدر على GitHub</a></p></div>
<div id="modal" class="modal" hidden><div class="panel"><h2 id="panelTitle">MODE</h2><p id="panelText">اختر نمط الحساب مثل الجهاز الأصلي.</p><div id="modeGrid" class="modes"></div><button id="closeModal" class="close">إغلاق</button></div></div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s), formula=$('#formula'), answer=$('#answer'), hist=$('#historyLine'), hint=$('#hint');
let expr='',last=null,history=[],historyIndex=-1,shift=false,alpha=false,angle='DEG',mode='COMP',memory=0,decimal='normal';
const modes=[['COMP','حساب عام'],['CMPLX','أعداد مركبة'],['STAT','إحصاء وانحدار'],['BASE-N','ثنائي/ثماني/عشري/سداسي عشري'],['EQN','حل المعادلات'],['MATRIX','مصفوفات حتى 3×3'],['TABLE','جدول قيم دالة'],['VECTOR','متجهات']];
function tex(s){let t=s.replaceAll('×','\\times ').replaceAll('÷','\\div ').replaceAll('−','-').replaceAll('π','\\pi ').replaceAll('√','\\sqrt ');try{return window.katex?katex.renderToString(t,{throwOnError:false}):t}catch{return t}}
function render(){formula.innerHTML=expr?tex(expr):'0';answer.innerHTML=last===null?'':tex(String(last));$('#shiftLed').classList.toggle('on',shift);$('#alphaLed').classList.toggle('on',alpha);$('#memLed').classList.toggle('on',memory!==0);$('#angleLed').textContent=angle;$('#angleButton').textContent=angle;$('#modeLed').textContent=mode;hint.textContent=(mode==='COMP'?'MathO · Norm 1':mode)+' · '+angle}
function insert(v){if(v==='−')v='−';expr+=v;last=null;render()}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1900)}
function trig(name,x){const n=Number(x);const r=angle==='DEG'?n*Math.PI/180:angle==='GRA'?n*Math.PI/200:n;return Math[name](r)}
function evaluate(s){let q=s.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-').replaceAll('π','pi').replaceAll('√','sqrt').replace(/Ans/g,String(last??0));
  const scope={pi:Math.PI,e:Math.E,Ans:last??0,sin:x=>trig('sin',x),cos:x=>trig('cos',x),tan:x=>trig('tan',x),asin:x=>angle==='DEG'?Math.asin(x)*180/Math.PI:Math.asin(x),acos:x=>angle==='DEG'?Math.acos(x)*180/Math.PI:Math.acos(x),atan:x=>angle==='DEG'?Math.atan(x)*180/Math.PI:Math.atan(x),sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh};
  return math.evaluate(q,scope)
}
function nice(v){if(typeof v==='number'){if(Math.abs(v)<1e-12)v=0;return Number(v.toPrecision(12)).toString()}return String(v)}
function toFraction(n){if(!Number.isFinite(n)||Math.abs(n)>1e9)return null;let sign=n<0?-1:1,n0=Math.abs(n),best=[1,0],err=n0;for(let d=1;d<=10000;d++){let p=Math.round(n0*d),e=Math.abs(n0-p/d);if(e<err){best=[p,d];err=e}if(e<1e-10)break}if(best[1]===1)return String(sign*best[0]);return (sign<0?'-':'')+best[0]+'/'+best[1]}
function equals(){if(!expr)return;try{const v=evaluate(expr);last=v;answer.innerHTML=tex(nice(v));hist.textContent=expr+' =';history.push({e:expr,v});historyIndex=history.length;expr='';toast('تم الحساب');render()}catch(e){answer.textContent='Math ERROR';toast('تحقق من الأقواس أو ترتيب العملية')}}
function clear(){expr='';last=null;hist.textContent='';answer.textContent='';render()}
function openModal(kind){const grid=$('#modeGrid');grid.innerHTML='';$('#panelTitle').textContent=kind==='mode'?'MODE':'SETUP';$('#panelText').textContent=kind==='mode'?'اختر نمط الحساب الذي يحاكي قائمة الجهاز.':'غيّر زاوية القياس أو شكل العرض.';if(kind==='mode'){modes.forEach(([id,desc])=>{const b=document.createElement('button');b.className='mode'+(id===mode?' active':'');b.innerHTML='<b>'+id+'</b><small>'+desc+'</small>';b.onclick=()=>{mode=id;closeModal();if(id!=='COMP')toast(id+' — الواجهة جاهزة للتوسعة');render()};grid.appendChild(b)})}else{[['DEG','درجات'],['RAD','راديان'],['GRA','غراديان'],['MathO','عرض طبيعي'],['LineO','عرض خطي']].forEach(([id,desc])=>{const b=document.createElement('button');b.className='mode';b.innerHTML='<b>'+id+'</b><small>'+desc+'</small>';b.onclick=()=>{if(['DEG','RAD','GRA'].includes(id)){angle=id;render()}else{hint.textContent=id+' · '+angle}closeModal()};grid.appendChild(b)})}$('#modal').hidden=false}
function closeModal(){$('#modal').hidden=true}
function action(a){if(a==='shift'){shift=!shift;render();return}if(a==='alpha'){alpha=!alpha;render();return}if(a==='mode'||a==='setup'){openModal(a);return}if(a==='equals'){equals();return}if(a==='clear'){clear();return}if(a==='delete'){expr=expr.slice(0,-1);render();return}if(a==='ans'){insert('Ans');return}if(a==='memory'){if(last!==null){memory+=Number(last);toast('M = '+memory);render()}else if(memory){insert(String(memory))}return}if(a==='back'&&history.length){historyIndex=Math.max(0,historyIndex-1);expr=history[historyIndex].e;render()}if(a==='forward'&&history.length){historyIndex=Math.min(history.length,historyIndex+1);expr=historyIndex<history.length?history[historyIndex].e:'';render()}}
$('#keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action)action(b.dataset.action);else if(b.dataset.insert){let v=b.dataset.insert;if(shift){const alt={'sin(':'asin(','cos(':'acos(','tan(':'atan(','log(':'10^(','ln(':'e^','√(':'∛('};v=alt[v]||v;shift=false}insert(v)}});$('#modeButton').onclick=()=>openModal('mode');$('#setupButton').onclick=()=>openModal('setup');$('#clearButton').onclick=clear;$('#angleButton').onclick=()=>{angle=angle==='DEG'?'RAD':angle==='RAD'?'GRA':'DEG';render()};$('#formatButton').onclick=()=>{if(last!==null){const f=toFraction(Number(last));answer.innerHTML=f?tex(f):tex(nice(last));toast(f?'كسر دقيق تقريبي':'صيغة عشرية')}};$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Enter')equals();else if(e.key==='Escape')clear();else if(e.key==='Backspace')action('delete');else if(e.key==='Shift')action('shift');else if(/[0-9+\-*/().,!]/.test(e.key)){const m={'*':'×','/':'÷','-':'−'};insert(m[e.key]||e.key)}});render();
</script>
</body></html>
